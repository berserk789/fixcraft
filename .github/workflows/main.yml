name: build
on: [push, workflow_dispatch]

jobs:
  fabric:
    name: fabric ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21",   range: "1.21" }
          - { mc: "1.21.1", range: "1.21.1" }
          - { mc: "1.21.3", range: ">=1.21.2 <=1.21.3" }
          - { mc: "1.21.4", range: "1.21.4" }
          - { mc: "1.21.5", range: "1.21.5" }
          - { mc: "1.21.8", range: ">=1.21.6 <=1.21.8" }
    defaults:
      run:
        working-directory: fabric-1.21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Find the right library versions for this Minecraft version
        id: v
        run: |
          MC="${{ matrix.mc }}"
          YARN=$(curl -fsS "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version')
          LOADER=$(curl -fsS "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[]|select(.stable)][0].version')
          FAPI=$(curl -fsS -H "User-Agent: fix-client-ci" "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number')
          echo "yarn=$YARN loader=$LOADER fapi=$FAPI"
          for x in "$YARN" "$LOADER" "$FAPI"; do
            if [ -z "$x" ] || [ "$x" = "null" ]; then echo "could not resolve versions"; exit 1; fi
          done
          echo "yarn=$YARN" >> "$GITHUB_OUTPUT"
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "fapi=$FAPI" >> "$GITHUB_OUTPUT"
      - run: >
          gradle build
          -Pmc=${{ matrix.mc }}
          "-Pyarn=${{ steps.v.outputs.yarn }}"
          "-Ploader=${{ steps.v.outputs.loader }}"
          "-Pfapi=${{ steps.v.outputs.fapi }}"
          "-Pmcrange=${{ matrix.range }}"
      - run: cp build/libs/fix-client-1.0.0.jar fix-client-${{ matrix.mc }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar-fabric-${{ matrix.mc }}
          path: fabric-1.21/fix-client-${{ matrix.mc }}.jar

  fabric-1-20:
    name: fabric ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.20.1", range: ">=1.20 <=1.20.1",   java: "17", bg: "old", overlay: "drawItemInSlot" }
          - { mc: "1.20.2", range: "1.20.2",            java: "17", bg: "new", overlay: "drawItemInSlot" }
          - { mc: "1.20.4", range: ">=1.20.3 <=1.20.4", java: "17", bg: "new", overlay: "drawItemInSlot" }
          - { mc: "1.20.6", range: ">=1.20.5 <=1.20.6", java: "21", bg: "new", overlay: "drawStackOverlay" }
    defaults:
      run:
        working-directory: fabric-1.21
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Turn the sources into the 1.20 version
        run: python3 patches/to-1.20.py "${{ matrix.bg }}" "${{ matrix.overlay }}"
      - name: Find the right library versions for this Minecraft version
        id: v
        run: |
          MC="${{ matrix.mc }}"
          YARN=$(curl -fsS "https://meta.fabricmc.net/v2/versions/yarn/$MC" | jq -r '.[0].version')
          LOADER=$(curl -fsS "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[]|select(.stable)][0].version')
          FAPI=$(curl -fsS -H "User-Agent: fix-client-ci" "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number')
          echo "yarn=$YARN loader=$LOADER fapi=$FAPI"
          for x in "$YARN" "$LOADER" "$FAPI"; do
            if [ -z "$x" ] || [ "$x" = "null" ]; then echo "could not resolve versions"; exit 1; fi
          done
          echo "yarn=$YARN" >> "$GITHUB_OUTPUT"
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "fapi=$FAPI" >> "$GITHUB_OUTPUT"
      - run: >
          gradle build
          -Pmc=${{ matrix.mc }}
          -Pjava=${{ matrix.java }}
          "-Pyarn=${{ steps.v.outputs.yarn }}"
          "-Ploader=${{ steps.v.outputs.loader }}"
          "-Pfapi=${{ steps.v.outputs.fapi }}"
          "-Pmcrange=${{ matrix.range }}"
      - run: cp build/libs/fix-client-1.0.0.jar fix-client-${{ matrix.mc }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar-fabric-${{ matrix.mc }}
          path: fabric-1.21/fix-client-${{ matrix.mc }}.jar

  fabric-26:
    name: fabric ${{ matrix.mc }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "26.1.2", range: ">=26.1 <=26.1.2" }
          - { mc: "26.2",   range: "26.2" }
          - { mc: "26.3",   range: "26.3" }
    defaults:
      run:
        working-directory: fabric-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Find the right library versions for this Minecraft version
        id: v
        run: |
          MC="${{ matrix.mc }}"
          LOADER=$(curl -fsS "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[]|select(.stable)][0].version')
          FAPI=$(curl -fsS -H "User-Agent: fix-client-ci" "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number')
          echo "loader=$LOADER fapi=$FAPI"
          for x in "$LOADER" "$FAPI"; do
            if [ -z "$x" ] || [ "$x" = "null" ]; then echo "could not resolve versions"; exit 1; fi
          done
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "fapi=$FAPI" >> "$GITHUB_OUTPUT"
      - run: >
          gradle build
          -Pmc=${{ matrix.mc }}
          "-Ploader=${{ steps.v.outputs.loader }}"
          "-Pfapi=${{ steps.v.outputs.fapi }}"
          "-Pmcrange=${{ matrix.range }}"
      - run: cp build/libs/fix-client-1.0.0.jar fix-client-${{ matrix.mc }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar-fabric-${{ matrix.mc }}
          path: fabric-26/fix-client-${{ matrix.mc }}.jar

  fabric-1-21-11:
    name: fabric 1.21.11
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mc: "1.21.11", range: "1.21.11" }
    defaults:
      run:
        working-directory: fabric-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Turn the 26 sources into the 1.21.11 version
        run: |
          python3 patches/to-1.21.11.py
          cp build.mojang.gradle build.gradle
      - name: Find the right library versions for this Minecraft version
        id: v
        run: |
          MC="${{ matrix.mc }}"
          LOADER=$(curl -fsS "https://meta.fabricmc.net/v2/versions/loader" | jq -r '[.[]|select(.stable)][0].version')
          FAPI=$(curl -fsS -H "User-Agent: fix-client-ci" "https://api.modrinth.com/v2/project/fabric-api/version?game_versions=%5B%22$MC%22%5D&loaders=%5B%22fabric%22%5D" | jq -r '.[0].version_number')
          echo "loader=$LOADER fapi=$FAPI"
          for x in "$LOADER" "$FAPI"; do
            if [ -z "$x" ] || [ "$x" = "null" ]; then echo "could not resolve versions"; exit 1; fi
          done
          echo "loader=$LOADER" >> "$GITHUB_OUTPUT"
          echo "fapi=$FAPI" >> "$GITHUB_OUTPUT"
      - run: >
          gradle build
          -Pmc=${{ matrix.mc }}
          "-Ploader=${{ steps.v.outputs.loader }}"
          "-Pfapi=${{ steps.v.outputs.fapi }}"
          "-Pmcrange=${{ matrix.range }}"
      - run: cp build/libs/fix-client-1.0.0.jar fix-client-${{ matrix.mc }}.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar-fabric-${{ matrix.mc }}
          path: fabric-26/fix-client-${{ matrix.mc }}.jar

  forge-1-8-9:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: forge-1.8.9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "7.6.4"
      - run: gradle build
      - run: cp build/libs/fixclient-1.0.0.jar fix-client-1.8.9.jar
      - uses: actions/upload-artifact@v4
        with:
          name: jar-1.8.9
          path: forge-1.8.9/fix-client-1.8.9.jar

  app:
    name: Fix Client installer (.exe)
    needs: [fabric, fabric-1-20, fabric-26, fabric-1-21-11, forge-1-8-9]
    if: always()
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: app/mods
          pattern: jar-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx electron-builder --win --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Fix-Client-Installer
          path: app/dist/*.exe

  bundle:
    needs: [fabric, fabric-1-20, fabric-26, fabric-1-21-11, forge-1-8-9]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: fix-client-all
          path: out/*.jar
